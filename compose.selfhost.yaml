services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: desk
      POSTGRES_USER: desk
      POSTGRES_PASSWORD: ${DESK_DB_PASSWORD:?DESK_DB_PASSWORD in .env.selfhost setzen}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "desk", "-d", "desk"]
      interval: 5s
      timeout: 3s
      retries: 12
  desk:
    build:
      context: .
      args:
        DESK_BUILD_COMMIT: ${DESK_BUILD_COMMIT:-}
        DESK_SOURCE_URL: ${DESK_SOURCE_URL:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DESK_ORIGIN: ${DESK_ORIGIN:?DESK_ORIGIN in .env.selfhost setzen}
      DESK_AUTH_SECRET: ${DESK_AUTH_SECRET:?DESK_AUTH_SECRET in .env.selfhost setzen}
      DATABASE_URL: postgres://desk:${DESK_DB_PASSWORD:?DESK_DB_PASSWORD in .env.selfhost setzen}@db:5432/desk
    ports:
      - "127.0.0.1:${DESK_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - fetch('http://127.0.0.1:3000/api/v1/ready',{signal:AbortSignal.timeout(3000)}).then(response=>process.exit(response.ok?0:1),()=>process.exit(1))
      interval: 5s
      timeout: 4s
      start_period: 10s
      retries: 4

volumes:
  postgres:
