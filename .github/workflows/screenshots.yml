name: OIDC-Anmeldung Vergleich für PR 215

on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comparison:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - state: vorher
            commit: 46a7ad2ebb701cb12ff8ff7b69ac14b3d55502d4
          - state: nachher
            commit: c1f06ae87fa4ab1735e998487d1b618921a2980c
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: desk
          POSTGRES_PASSWORD: desk
          POSTGRES_DB: desk_oidc_demo
        ports:
          - 5438:5432
        options: >-
          --health-cmd "pg_isready -U desk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 8
    env:
      DATABASE_URL: postgresql://desk:desk@127.0.0.1:5438/desk_oidc_demo
      DESK_ORIGIN: http://localhost:4173
      DESK_AUTH_SECRET: nur-fuer-die-oidc-bildprobe
    steps:
      - uses: actions/checkout@v6
        with:
          path: review
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          path: desk
          ref: ${{ matrix.commit }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: desk/package.json
      - name: Anmeldeseite aufnehmen
        working-directory: desk
        env:
          DESK_CAPTURE_STATE: ${{ matrix.state }}
          DESK_CAPTURE_COMMIT: ${{ matrix.commit }}
        run: |
          test "$(git rev-parse HEAD)" = "$DESK_CAPTURE_COMMIT"
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
          bun run migrate
          bun run dev --port 4173 --strictPort &
          desk_server=$!
          trap 'kill "$desk_server" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS "$DESK_ORIGIN/api/v1/ready" >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS "$DESK_ORIGIN/api/v1/ready" >/dev/null
          bun ../review/e2e/oidc-visuals.mjs "$PWD" "$DESK_ORIGIN" "$DESK_CAPTURE_STATE"
      - uses: actions/upload-artifact@v6
        with:
          name: desk-oidc-anmeldung-${{ matrix.state }}
          path: desk/build/oidc-visuals/
          if-no-files-found: error
