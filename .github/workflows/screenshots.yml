name: Ressourcenfilter Vergleich für PR 158
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comparison:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - state: vorher
            commit: 46a7ad2ebb701cb12ff8ff7b69ac14b3d55502d4
          - state: nachher
            commit: 22f9d2fdf21a486ff43e79707f4819ac13112520
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: desk
          POSTGRES_PASSWORD: desk
          POSTGRES_DB: desk_reservation_filters_demo
        ports:
          - 5438:5432
        options: >-
          --health-cmd "pg_isready -U desk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://desk:desk@127.0.0.1:5438/desk_reservation_filters_demo
      DESK_DEMO_PASSWORD: muster-ressourcenfilter-pruefung
      DESK_ORIGIN: http://127.0.0.1:4173
      DESK_AUTH_SECRET: nur-fuer-die-isolierte-ressourcenfilter-bildprobe
    steps:
      - uses: actions/checkout@v6
        with:
          path: review
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          path: desk
          ref: ${{ matrix.commit }}
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          path: seed
          ref: 46a7ad2ebb701cb12ff8ff7b69ac14b3d55502d4
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: desk/package.json
      - name: Gleichen Altbestand für beide Stände anlegen
        working-directory: seed
        run: |
          bun install --frozen-lockfile
          bun run migrate
          bun run demo
      - name: Aufnahme auf dem ausgewählten Commit
        working-directory: desk
        run: |
          test "$(git rev-parse HEAD)" = "${{ matrix.commit }}"
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
          bun run migrate
          bun run dev --port 4173 --strictPort &
          desk_server=$!
          trap 'kill "$desk_server" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS "$DESK_ORIGIN/api/v1/ready" >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS "$DESK_ORIGIN/api/v1/ready" >/dev/null
          cp ../review/e2e/filter-comparison-local.spec.ts e2e/filter-comparison-local.spec.ts
          DESK_E2E_URL="$DESK_ORIGIN" DESK_FILTER_SCREENSHOTS=build/ressourcenfilter bunx playwright test --project=core e2e/filter-comparison-local.spec.ts
      - uses: actions/upload-artifact@v6
        with:
          name: desk-ressourcenfilter-${{ matrix.state }}
          path: desk/build/ressourcenfilter/
          if-no-files-found: error
