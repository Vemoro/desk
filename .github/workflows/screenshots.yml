name: Projektkontaktfilter Vergleich für PR 189
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comparison:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - state: vorher
            commit: cc1a8261ebbd639ead541815f6bd8a75854f0927
          - state: nachher
            commit: 56fda28fad469b0dfbee0524def1707221e97f3f
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: desk
          POSTGRES_PASSWORD: desk
          POSTGRES_DB: desk_contact_demo
        ports:
          - 5438:5432
        options: >-
          --health-cmd "pg_isready -U desk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://desk:desk@127.0.0.1:5438/desk_contact_demo
      DESK_DEMO_PASSWORD: muster-kontaktfilter-pruefung
      DESK_ORIGIN: http://127.0.0.1:4173
      DESK_AUTH_SECRET: nur-fuer-die-isolierte-kontaktfilter-bildprobe
    steps:
      - uses: actions/checkout@v6
        with:
          path: review
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          path: desk
          ref: ${{ matrix.commit }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: desk/package.json
      - name: Aufnahme auf dem ausgewählten Commit
        working-directory: desk
        run: |
          test "$(git rev-parse HEAD)" = "${{ matrix.commit }}"
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
          bun run migrate
          bun run demo
          bun run dev --port 4173 --strictPort &
          desk_server=$!
          trap 'kill "$desk_server" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS "$DESK_ORIGIN/api/v1/ready" >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS "$DESK_ORIGIN/api/v1/ready" >/dev/null
          bun ../review/e2e/project-contact-visuals.mjs "$PWD" "$DESK_ORIGIN" build/project-contact-visuals "${{ matrix.state }}"
      - uses: actions/upload-artifact@v6
        with:
          name: desk-kontaktfilter-${{ matrix.state }}
          path: desk/build/project-contact-visuals/
          if-no-files-found: error
