name: Kanban-Positionen Vergleich für PR 211
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comparison:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - state: vorher
            commit: 46a7ad2ebb701cb12ff8ff7b69ac14b3d55502d4
          - state: nachher
            commit: 80f5bca78547a6063a3a5752dc912767b8bb79ef
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: desk
          POSTGRES_PASSWORD: desk
          POSTGRES_DB: desk_kanban_demo
        ports:
          - 5438:5432
        options: >-
          --health-cmd "pg_isready -U desk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://desk:desk@127.0.0.1:5438/desk_kanban_demo
      DESK_DEMO_PASSWORD: muster-kanban-pruefung
      DESK_ORIGIN: http://127.0.0.1:4173
      DESK_AUTH_SECRET: nur-fuer-die-isolierte-kanban-bildprobe
    steps:
      - uses: actions/checkout@v6
        with:
          path: review
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          path: desk
          ref: ${{ matrix.commit }}
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          path: seed
          ref: 46a7ad2ebb701cb12ff8ff7b69ac14b3d55502d4
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: desk/package.json
      - name: Gleichen Altbestand für beide Stände anlegen
        working-directory: seed
        run: |
          bun install --frozen-lockfile
          bun run migrate
          bun run demo
      - name: Aufnahme auf dem ausgewählten Commit
        working-directory: desk
        run: |
          test "$(git rev-parse HEAD)" = "${{ matrix.commit }}"
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
          bun run migrate
          bun run dev --port 4173 --strictPort &
          desk_server=$!
          trap 'kill "$desk_server" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS "$DESK_ORIGIN/api/v1/ready" >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS "$DESK_ORIGIN/api/v1/ready" >/dev/null
          bun ../review/e2e/kanban-order-visuals.mjs "$PWD" "$DESK_ORIGIN" build/kanban-order-visuals "${{ matrix.state }}"
      - uses: actions/upload-artifact@v6
        with:
          name: desk-kanban-positionen-${{ matrix.state }}
          path: desk/build/kanban-order-visuals/
          if-no-files-found: error
