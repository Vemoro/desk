name: Kostenstellenvergleich PR 184
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comparison:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - state: vorher
            commit: 056d9703360c3862d67e000eb9f266ea129e2fab
          - state: nachher
            commit: 9f2990fe283f5652aa2ad007fa6271236b95df2a
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: desk
          POSTGRES_PASSWORD: desk
          POSTGRES_DB: desk_demo
        ports:
          - 5438:5432
        options: >-
          --health-cmd "pg_isready -U desk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://desk:desk@127.0.0.1:5438/desk_demo
      DESK_DEMO_PASSWORD: formular-muster-passwort
      DESK_VISUAL_STATE: ${{ matrix.state }}
      DESK_ORIGIN: http://localhost:4173
      DESK_AUTH_SECRET: nur-fuer-die-isolierte-formular-bildprobe
    steps:
      - uses: actions/checkout@v6
        with:
          path: review
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          path: desk
          ref: ${{ matrix.commit }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: desk/package.json
      - name: Aufnahme auf dem ausgewählten Commit
        working-directory: desk
        run: |
          test "$(git rev-parse HEAD)" = "${{ matrix.commit }}"
          cp ../review/e2e/cost-center-visuals.spec.ts e2e/
          cp ../review/playwright.cost-center-visuals.config.ts .
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
          bun run migrate
          bun run demo
          bunx playwright test -c playwright.cost-center-visuals.config.ts
      - uses: actions/upload-artifact@v6
        with:
          name: desk-kostenstelle-${{ matrix.state }}
          path: desk/build/cost-center-visuals/
          if-no-files-found: error
