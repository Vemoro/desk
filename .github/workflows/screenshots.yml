name: Doku-Screenshots erstellen
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stand:
          - name: vorher
            sha: 00d01308b16c4d7d975f7c2224b1e213a6697d5e
          - name: nachher
            sha: 92dd547f3d94d6b6f9007c717e7c8b6bad3189b5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: desk
          POSTGRES_PASSWORD: desk
          POSTGRES_DB: desk_demo
        ports:
          - 5438:5432
        options: >-
          --health-cmd "pg_isready -U desk -d desk_demo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://desk:desk@127.0.0.1:5438/desk_demo
      DESK_DEMO_PASSWORD: muster-test-passwort
      DESK_ORIGIN: http://localhost:4173
      DESK_E2E_URL: http://localhost:4173
      DESK_AUTH_SECRET: nur-fuer-die-isolierte-desk-testdatenbank
      DESK_ZAMMAD_DRAFT_EVIDENCE: build/screenshots
    steps:
      - uses: actions/checkout@v6
      - run: cp e2e/zammad-draft-evidence.spec.ts /tmp/zammad-draft-evidence.spec.ts
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.stand.sha }}
      - run: cp /tmp/zammad-draft-evidence.spec.ts e2e/zammad-draft-evidence.spec.ts
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run migrate && bun run demo && bun run build
      - run: |
          NITRO_HOST=127.0.0.1 NITRO_PORT=4173 bun .output/server/index.mjs > /tmp/desk-output.log 2>&1 &
          desk_pid=$!
          trap 'kill "$desk_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 25); do
            if curl -fsS --max-time 2 http://127.0.0.1:4173/api/v1/ready >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/api/v1/ready >/dev/null
          bunx playwright test --project=core e2e/zammad-draft-evidence.spec.ts
      - uses: actions/upload-artifact@v6
        with:
          name: Desk-93-${{ matrix.stand.name }}
          path: build/screenshots/
          if-no-files-found: error
