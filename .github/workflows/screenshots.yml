name: Überfällig und Terminsortierung für PR 196 prüfen
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comparison:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: vorher
            commit: 00d01308b16c4d7d975f7c2224b1e213a6697d5e
          - label: nachher
            commit: 3ec32928347410311f26502cf0d63e4c3ed2bacb
          - label: kombiniert
            commit: 7783f541940f18a31d9bfe81a5b0596c3f1dd497
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: desk
          POSTGRES_PASSWORD: desk
          POSTGRES_DB: desk_comparison_demo
        ports:
          - 5438:5432
        options: >-
          --health-cmd "pg_isready -U desk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 8
    env:
      DATABASE_URL: postgres://desk:desk@127.0.0.1:5438/desk_comparison_demo
      DESK_ORIGIN: http://localhost:4402
      DESK_DEMO_PASSWORD: muster-vergleich-196
      DESK_AUTH_SECRET: nur-fuer-die-isolierte-projekt-ansicht
    steps:
      - uses: actions/checkout@v6
        with:
          path: review
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.commit }}
          path: app
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: app/package.json
      - name: Projektliste aus identischen Demo-Daten aufnehmen
        working-directory: app
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          CAPTURE_LABEL: ${{ matrix.label }}
          CAPTURE_COMMIT: ${{ matrix.commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CAPTURE_COMMIT"
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
          bun run migrate
          bun run demo
          docker exec "$POSTGRES_CONTAINER" psql -v ON_ERROR_STOP=1 -U desk -d desk_comparison_demo \
            -c "update projects set due='2028-05-16' where name='Büroinstallation Westflügel'; update projects set due='2028-05-15' where name='Veranstaltungsbetreuung im Kulturhaus'; insert into projects(name,contact_id,stage,due) select 'Muster Abrechnung',id,'complete','2028-05-16' from contacts order by name limit 1; insert into projects(name,contact_id,stage,due) select 'Muster Absage',id,'cancelled','2028-05-16' from contacts order by name limit 1;"
          bun run dev --port 4402 --strictPort &
          desk_server=$!
          trap 'kill "$desk_server" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS "$DESK_ORIGIN/api/v1/ready" >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS "$DESK_ORIGIN/api/v1/ready" >/dev/null
          node ../review/scripts/overdue-review-capture.mjs "$CAPTURE_LABEL" build/overdue-review
      - uses: actions/upload-artifact@v6
        with:
          name: Desk-Ueberfaellige-Projekte-${{ matrix.label }}
          path: app/build/overdue-review/
          if-no-files-found: error
