name: Projektansichten Vergleich für PR 156
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comparison:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - state: vorher
            commit: 865197eaf76b37a024930a72a083984b4ee0eb36
          - state: nachher
            commit: a4e678e45901f7e259686e13f4f351631ba7ed44
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: desk
          POSTGRES_PASSWORD: desk
          POSTGRES_DB: desk_links_demo
        ports:
          - 5438:5432
        options: >-
          --health-cmd "pg_isready -U desk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://desk:desk@127.0.0.1:5438/desk_links_demo
      DESK_DEMO_PASSWORD: muster-links-pruefung
      DESK_ORIGIN: http://127.0.0.1:4173
      DESK_AUTH_SECRET: nur-fuer-die-isolierte-links-bildprobe
    steps:
      - uses: actions/checkout@v6
        with:
          path: review
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          path: desk
          ref: ${{ matrix.commit }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: desk/package.json
      - name: Aufnahme auf dem ausgewählten Commit
        working-directory: desk
        run: |
          test "$(git rev-parse HEAD)" = "${{ matrix.commit }}"
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
          bun run migrate
          bun run demo
          bun run dev --port 4173 --strictPort &
          desk_server=$!
          trap 'kill "$desk_server" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS "$DESK_ORIGIN/api/v1/ready" >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS "$DESK_ORIGIN/api/v1/ready" >/dev/null
          bun ../review/e2e/project-link-visuals.mjs "$PWD" "$DESK_ORIGIN" build/project-link-visuals "${{ matrix.state }}"
      - uses: actions/upload-artifact@v6
        with:
          name: desk-projektansichten-${{ matrix.state }}
          path: desk/build/project-link-visuals/
          if-no-files-found: error
