name: Doku-Screenshots erstellen
on: workflow_dispatch
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: desk
          POSTGRES_PASSWORD: desk
          POSTGRES_DB: desk_demo
        ports:
          - 5438:5432
        options: >-
          --health-cmd "pg_isready -U desk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://desk:desk@127.0.0.1:5438/desk_demo
      DESK_DEMO_PASSWORD: muster-test-passwort
      DESK_ORIGIN: http://localhost:4173
      DESK_AUTH_SECRET: nur-fuer-die-isolierte-desk-testdatenbank
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run migrate && bun run demo && bun run docs:screenshots
      - uses: actions/upload-artifact@v6
        with:
          name: Desk-Doku-Screenshots
          path: build/screenshots/
          if-no-files-found: error
