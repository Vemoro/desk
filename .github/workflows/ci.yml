name: Prüfungen
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  desk:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: desk
          POSTGRES_PASSWORD: desk
          POSTGRES_DB: desk_test
        ports:
          - 5438:5432
        options: >-
          --health-cmd "pg_isready -U desk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://desk:desk@127.0.0.1:5438/desk_test
      DESK_DEMO_PASSWORD: muster-test-passwort
      DESK_ORIGIN: http://localhost:4173
      DESK_AUTH_SECRET: nur-fuer-die-isolierte-desk-testdatenbank
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build
      - shell: bash
        run: |
          export DESK_CHECK_BASE="${DESK_CHECK_BASE:-$(git rev-parse refs/remotes/origin/main)}"
          bun run check
        env:
          DESK_CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Veröffentlichte Migrationen und Upgrade prüfen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DATABASE_URL: postgres://desk:desk@127.0.0.1:5438/desk_release_upgrade_test
        run: |
          docker exec "${{ job.services.postgres.id }}" createdb -U desk desk_release_upgrade_test
          gh api repos/Vemoro/desk/releases --paginate --slurp > "$RUNNER_TEMP/desk-releases.json"
          python3 scripts/check-release-upgrade.py "$RUNNER_TEMP/desk-releases.json"
      - run: bun run migrate
      - run: bun run test
      - run: bunx playwright install --with-deps chromium
      - run: docker exec "${{ job.services.postgres.id }}" createdb -U desk desk_demo
      - run: bun run migrate && bun run demo && bun run e2e
        env:
          DATABASE_URL: postgres://desk:desk@127.0.0.1:5438/desk_demo
      - run: exec bash scripts/check-runtime-image.sh
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: Browser-Fehler
          path: |
            test-results/
            !test-results/runtime-image/**
          if-no-files-found: ignore
