name: Übernehmen

on:
  issue_comment:
    types: [created]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      probe:
        description: Nur anzeigen, welche Tickets erinnert oder zurückgegeben würden
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: desk-roadmap-zuweisungen
  queue: max

jobs:
  roadmap:
    if: >-
      github.repository == 'Vemoro/desk' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
        (!github.event.issue.pull_request && github.event.comment.user.type == 'User' &&
          (contains(github.event.comment.body, '/übernehmen') ||
           contains(github.event.comment.body, '/uebernehmen') ||
           contains(github.event.comment.body, '/freigeben'))))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Zugriff auf Desk Roadmap
        if: vars.DESK_ROADMAP_APP_CLIENT_ID != ''
        id: roadmap
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.DESK_ROADMAP_APP_CLIENT_ID }}
          private-key: ${{ secrets.DESK_ROADMAP_APP_PRIVATE_KEY }}
          owner: Vemoro
          repositories: desk
          permission-organization-projects: write
          permission-issues: read
      - run: bun scripts/roadmap/run.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROADMAP_TOKEN: ${{ steps.roadmap.outputs.token }}
          ROADMAP_PROBE: ${{ github.event_name == 'workflow_dispatch' && inputs.probe }}
