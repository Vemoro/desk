name: Arbeitsgrundlage
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'CHANGELOG.md'
      - 'CLAUDE.md'
      - 'CONTRIBUTING.md'
      - 'DESIGN.md'
      - 'README.md'
      - 'docs/**'
      - '.agents/skills/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - '.github/workflows/arbeitsgrundlage.yml'
      - 'scripts/check-workflow-docs.py'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  doku:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 734f08b1052c4d30fc22608e04183a3adaa76c76
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout prüfen
        run: test "$(git rev-parse HEAD)" = 734f08b1052c4d30fc22608e04183a3adaa76c76
      - name: Whitespace prüfen
        env:
          BASE_SHA: 9204fd16a2f30e0da4efe0c0f524fdbbe59dcd8d
        run: |
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git diff --check "$BASE_SHA" HEAD
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff-tree --root --check --no-commit-id -r HEAD
          fi
      - name: Verweise und Skills prüfen
        run: python3 scripts/check-workflow-docs.py
